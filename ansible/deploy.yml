---
- name: Deploy CalculatorApp to Azure Kubernetes Service
  hosts: local
  connection: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes Deployment
      command: kubectl apply -f {{ playbook_dir }}/../k8s/deployment.yaml

    - name: Update deployment to the latest Jenkins image
      command: kubectl set image deployment/calculator-app calculator-app=cia2registry2026.azurecr.io/calculator-app:{{ lookup('env', 'IMAGE_TAG') }}

    - name: Apply Kubernetes Service
      command: kubectl apply -f {{ playbook_dir }}/../k8s/service.yaml

    - name: Wait for deployment rollout
      command: kubectl rollout status deployment/calculator-app --timeout=180s

    - name: Display deployment status
      command: kubectl get pods,services
      register: deployment_status

    - name: Show deployment results
      debug:
        var: deployment_status.stdout_lines
